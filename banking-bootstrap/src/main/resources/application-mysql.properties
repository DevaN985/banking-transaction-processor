# Requires a locally installed/running MySQL server and a database named bankingdb
spring.datasource.url=${BANKING_DB_URL:jdbc:mysql://localhost:3306/bankingdb}
spring.datasource.username=${BANKING_DB_USERNAME:banking}
spring.datasource.password=${BANKING_DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

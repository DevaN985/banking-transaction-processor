# Requires a locally installed/running PostgreSQL server and a database named bankingdb
spring.datasource.url=${BANKING_DB_URL:jdbc:postgresql://localhost:5432/bankingdb}
spring.datasource.username=${BANKING_DB_USERNAME:banking}
spring.datasource.password=${BANKING_DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

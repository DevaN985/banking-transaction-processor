# Select database using BANKING_DB_MODE: memory (default), mysql, postgres, or oracle
spring.profiles.active=${BANKING_DB_MODE:memory}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Oracle 19c local PDB. Set BANKING_DB_PASSWORD in your environment; do not commit credentials.
spring.datasource.url=${BANKING_DB_URL:jdbc:oracle:thin:@//localhost:1521/orclpdb}
spring.datasource.username=${BANKING_DB_USERNAME:banking_app}
spring.datasource.password=${BANKING_DB_PASSWORD:******}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/oracle
spring.flyway.baseline-on-migrate=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false



# Oracle 19c local PDB - local test configuration
spring.datasource.url=${BANKING_DB_URL:jdbc:oracle:thin:@//localhost:1521/orclpdb}
spring.datasource.username=${BANKING_DB_USERNAME:banking_app}
spring.datasource.password=${BANKING_DB_PASSWORD:******}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/oracle
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false


# Gmail SMTP - test configuration
spring.mail.host=${BANKING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${BANKING_MAIL_PORT:587}
spring.mail.username=*******@gmail.com
spring.mail.password=*********

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.notification.from=${BANKING_MAIL_FROM:**********@gmail.com}


# Disable Hibernate SQL logging
logging.level.org.hibernate.SQL=OFF

# Disable SQL parameter binding logs
logging.level.org.hibernate.orm.jdbc.bind=OFF
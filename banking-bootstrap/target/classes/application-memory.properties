# Embedded H2; no external database installation required
spring.datasource.url=jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2-specific Flyway migrations (Oracle SQL syntax is not portable to H2)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2


